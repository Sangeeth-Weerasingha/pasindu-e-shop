<!DOCTYPE html>
<html>
<head>
<title>Pasindu E-Shop 🔥</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:Inter,Arial;background:#f5f5f7;margin:0;padding:0}
header{background:black;color:white;padding:18px 30px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding:30px;max-width:1200px;margin:auto}
.card{background:white;border-radius:18px;padding:16px;box-shadow:0 6px 20px #0001;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 30px #0002}
.card img{width:100%;height:180px;object-fit:cover;border-radius:12px}
.price{font-weight:800;font-size:18px;margin:8px 0}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:black;color:white;cursor:pointer;font-weight:600}
.btn:active{transform:scale(.97)}
#cart{position:fixed;right:20px;bottom:20px;background:black;color:white;padding:16px 22px;border-radius:30px;cursor:pointer;box-shadow:0 8px 20px #0003}
.badge{background:red;color:white;border-radius:10px;padding:2px 8px;margin-left:6px;font-size:12px}
</style>
</head>
<body>
<header>
 <h2 style="margin:0">Pasindu E-Shop 🔥 Full Stack</h2>
 <span id="count">0 items</span>
</header>

<div id="products" class="grid"></div>
<div id="cart" onclick="showCart()">🛒 Cart <span id="cartCount" class="badge">0</span></div>

<script>
let productsData = [];
let cart = [];

async function loadProducts(){
    try{
        const res = await fetch('/api/products');
        productsData = await res.json();
        console.log("Loaded from API", productsData);
        render();
    }catch(e){
        console.error(e);
        document.getElementById('products').innerHTML = "<h3>API connect failed - Make sure backend running on 8080</h3>";
    }
}

function render(){
    document.getElementById('products').innerHTML = productsData.map((p,i)=>`
        <div class="card">
            <img src="${p.image}" onerror="this.src='https://via.placeholder.com/300'">
            <h3>${p.name}</h3>
            <p style="color:#666;font-size:13px">${p.category}</p>
            <div class="price">Rs. ${p.price.toLocaleString()}</div>
            <button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>
    `).join('');
}

function addToCart(id){
    const prod = productsData.find(x=>x.id===id);
    cart.push(prod);
    document.getElementById('cartCount').innerText = cart.length;
    document.getElementById('count').innerText = cart.length + " items";
    alert(prod.name + " added!");
}

function showCart(){
    if(cart.length===0) return alert("Cart empty!");
    let total = cart.reduce((s,p)=>s+p.price,0);
    alert(cart.map(c=>c.name).join("\n") + "\n\nTotal: Rs." + total.toLocaleString());
}

loadProducts();
</script>
</body>
</html>
