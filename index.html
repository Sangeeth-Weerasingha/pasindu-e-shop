<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasindu E-Shop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f5f7}header{background:#000;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;position:sticky;top:0}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding:20px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card img{width:100%;height:180px;object-fit:cover}.card-body{padding:15px}
.btn{width:100%;padding:10px;background:#000;color:#fff;border:none;border-radius:20px;cursor:pointer}
.cart-btn{position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:12px 20px;border-radius:30px;cursor:pointer}
.cart-count{background:red;padding:2px 7px;border-radius:50%;font-size:12px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:300;justify-content:center;align-items:center}
.modal.show{display:flex}.modal-content{background:#fff;width:90%;max-width:450px;border-radius:15px;max-height:80vh;display:flex;flex-direction:column}
.modal-header{padding:15px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.modal-body{padding:20px;overflow-y:auto;flex:1}.cart-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
.delete-btn{background:#ff3b30;color:#fff;border:none;padding:6px 12px;border-radius:15px;cursor:pointer}
.total{padding:15px 20px;border-top:2px solid #000;font-weight:bold;display:flex;justify-content:space-between;font-size:18px}
.checkout{margin:15px 20px;padding:12px;background:#000;color:#fff;border:none;border-radius:25px;cursor:pointer}
</style>
</head>
<body>
<header><h1>Pasindu E-Shop 🔥</h1><span id="headerCount">0 items</span></header>
<div class="products" id="products"></div>
<div class="cart-btn" onclick="openCart()">🛒 Cart <span class="cart-count" id="cartCount">0</span></div>
<div class="modal" id="cartModal"><div class="modal-content"><div class="modal-header"><h2>Your Cart</h2><span onclick="closeCart()" style="cursor:pointer;font-size:24px">&times;</span></div><div class="modal-body" id="cartItems"></div><div class="total"><span>Total:</span><span id="totalPrice">Rs. 0</span></div><button class="checkout" onclick="checkout()">Checkout</button></div></div>
<script>
const products=[{id:1,name:"iPhone 15 Pro Max",category:"Phones",price:385000,image:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400"},{id:2,name:"Samsung S24 Ultra",category:"Phones",price:320000,image:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400"},{id:3,name:"MacBook Air M2",category:"Laptops",price:285000,image:"https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=400"},{id:4,name:"Sony WH-1000XM5",category:"Audio",price:65000,image:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400"},{id:5,name:"Nike Air Jordan",category:"Shoes",price:25000,image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},{id:6,name:"Apple Watch Ultra",category:"Wearables",price:95000,image:"https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=400"}];
let cart=JSON.parse(localStorage.getItem('pasindu_cart')||'[]');
function renderProducts(){document.getElementById('products').innerHTML=products.map(p=>`<div class="card"><img src="${p.image}"><div class="card-body"><h3>${p.name}</h3><p>${p.category}</p><div style="font-weight:bold;margin:8px 0">Rs. ${p.price.toLocaleString()}</div><button class="btn" onclick="addToCart(${p.id})">Add to Cart</button></div></div>`).join('');}
function addToCart(id){const pro=products.find(x=>x.id===id);const ex=cart.find(x=>x.id===id);if(ex){ex.qty++;}else{cart.push({...pro,qty:1});}saveAndUpdate();}
function deleteFromCart(id){cart=cart.filter(x=>x.id!==id);saveAndUpdate();}
function saveAndUpdate(){localStorage.setItem('pasindu_cart',JSON.stringify(cart));updateCounts();renderCartItems();}
function updateCounts(){const totalItems=cart.reduce((s,i)=>s+i.qty,0);document.getElementById('cartCount').innerText=totalItems;document.getElementById('headerCount').innerText=totalItems+" items";const totalPrice=cart.reduce((s,i)=>s+i.price*i.qty,0);document.getElementById('totalPrice').innerText="Rs. "+totalPrice.toLocaleString();}
function renderCartItems(){const c=document.getElementById('cartItems');if(cart.length===0){c.innerHTML='<div style="text-align:center;padding:30px;color:#888">Cart empty<br>Add items!</div>';return;}c.innerHTML=cart.map(item=>`<div class="cart-item"><div><h4>${item.name}</h4><p>Rs. ${item.price.toLocaleString()} x ${item.qty}</p></div><button class="delete-btn" onclick="deleteFromCart(${item.id})">Delete</button></div>`).join('');}
function openCart(){renderCartItems();document.getElementById('cartModal').classList.add('show');}
function closeCart(){document.getElementById('cartModal').classList.remove('show');}
function checkout(){if(cart.length===0){alert('Cart empty!');return;}alert('Order placed! Total: '+document.getElementById('totalPrice').innerText);cart=[];saveAndUpdate();closeCart();}
renderProducts();updateCounts();
</script>
</body>
</html>
