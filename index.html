<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pasindu E-Shop</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
<header class="bg-white shadow sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 py-4 flex justify-between"><h1 class="text-2xl font-bold text-indigo-600">Pasindu E-Shop</h1><div class="flex gap-3"><input id="search" placeholder="Search..." class="border rounded-full px-4 py-2 w-48"><button onclick="toggleCart()" class="bg-indigo-600 text-white px-5 py-2 rounded-full">Cart <span id="cart-count" class="bg-white text-indigo-600 rounded-full px-2 text-sm font-bold">0</span></button></div></div></header>
<main class="max-w-7xl mx-auto px-4 py-8"><div id="products" class="grid grid-cols-1 sm:grid-cols-3 gap-6"></div></main>
<div id="cart-modal" class="fixed inset-0 bg-black/50 hidden z-50"><div class="bg-white max-w-md ml-auto h-full p-6"><div class="flex justify-between"><h2 class="font-bold text-xl">Cart</h2><button onclick="toggleCart()" class="text-2xl">&times;</button></div><div id="cart-items" class="mt-4"></div><p class="mt-6 border-t pt-4 font-bold text-xl">Total: $<span id="cart-total">0</span></p><button onclick="checkout()" class="w-full mt-4 bg-green-600 text-white py-3 rounded-full">Checkout</button></div></div>
<script>
let allProducts=[], cart=[];
async function loadProducts(){ const r=await fetch('/api/products'); allProducts=await r.json(); console.log(allProducts); render(allProducts); }
function getImg(name){
  name=name.toLowerCase();
  if(name.includes('iphone')) return 'https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500';
  if(name.includes('samsung')) return 'https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500';
  if(name.includes('macbook')||name.includes('mac')) return 'https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=500';
  if(name.includes('airpods')) return 'https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500';
  if(name.includes('ipad')) return 'https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500';
 if(name.includes('watch')) return 'https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500';
}
function render(list){
 document.getElementById('products').innerHTML=list.map(p=>`
  <div class="bg-white rounded-2xl shadow p-4">
   <img src="${getImg(p.name)}" class="w-full h-52 object-cover rounded-xl mb-4">
   <h3 class="font-bold">${p.name}</h3>
   <p class="text-gray-500 text-sm">${p.description||'Premium'}</p>
   <div class="flex justify-between items-center mt-3"><span class="text-indigo-600 font-bold text-xl">$${p.price}</span><button onclick="addToCart(${p.id})" class="bg-indigo-600 text-white px-4 py-2 rounded-full">+ Add</button></div>
  </div>`).join('');
}
function addToCart(id){ const p=allProducts.find(x=>x.id===id); const e=cart.find(x=>x.id===id); if(e)e.qty++; else cart.push({...p,qty:1}); updateCart(); }
function updateCart(){ document.getElementById('cart-count').textContent=cart.reduce((s,i)=>s+i.qty,0); document.getElementById('cart-total').textContent=cart.reduce((s,i)=>s+i.price*i.qty,0); document.getElementById('cart-items').innerHTML=cart.map(i=>`<div class="flex justify-between py-2 border-b"><span>${i.name} x${i.qty}</span><span>$${i.price*i.qty}</span></div>`).join('')||'Cart empty'; }
function toggleCart(){ document.getElementById('cart-modal').classList.toggle('hidden'); }
function checkout(){ alert('Order placed! $'+document.getElementById('cart-total').textContent); cart=[]; updateCart(); toggleCart(); }
document.getElementById('search').addEventListener('input', e=>{ render(allProducts.filter(p=>p.name.toLowerCase().includes(e.target.value.toLowerCase()))); });
loadProducts();
</script>
</body>
</html>
