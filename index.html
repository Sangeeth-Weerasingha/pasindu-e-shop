<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasindu E-Shop 🔥 Full Stack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f5f5f7}
header{background:#000;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:14px}
.price{font-weight:800;margin:8px 0}
.btn{width:100%;padding:10px;background:#000;color:#fff;border:none;border-radius:20px;cursor:pointer;font-weight:700}
.cart-btn{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:14px 22px;border-radius:30px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:50}
.cart-count{background:#ff3b30;padding:2px 8px;border-radius:50%;font-size:12px;margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:100;padding:15px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:420px;border-radius:18px;overflow:hidden;max-height:85vh;display:flex;flex-direction:column}
.modal-head{padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid #eee;font-weight:800}
.modal-body{padding:10px 20px;overflow:auto;flex:1}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #f0f0f0}
.del{background:#ff3b30;color:#fff;border:none;padding:7px 14px;border-radius:18px;cursor:pointer;font-weight:700}
.total{display:flex;justify-content:space-between;padding:16px 20px;border-top:2px solid #000;font-weight:800;font-size:18px}
.checkout{margin:0 20px 20px;padding:13px;background:#000;color:#fff;border:none;border-radius:24px;font-weight:800;cursor:pointer}
.empty{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>
<header><h1>Pasindu E-Shop 🔥 Full Stack</h1><div id="headCount">0 items</div></header>
<div class="products" id="products"></div>
<div class="cart-btn" onclick="openCart()">🛒 Cart <span class="cart-count" id="cartCount">0</span></div>

<div class="modal" id="cartModal" onclick="if(event.target===this)closeCart()">
<div class="modal-box">
<div class="modal-head"><span>Your Cart</span><span onclick="closeCart()" style="cursor:pointer;font-size:26px">&times;</span></div>
<div class="modal-body" id="cartItems"></div>
<div class="total"><span>Total</span><span id="totalPrice">Rs. 0</span></div>
<button class="checkout" onclick="checkout()">Checkout</button>
</div>
</div>

<script>
const products=[
{id:1,name:"iPhone 15 Pro Max",cat:"Phones",price:385000,img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400"},
{id:2,name:"Samsung S24 Ultra",cat:"Phones",price:320000,img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400"},
{id:3,name:"MacBook Air M2",cat:"Laptops",price:285000,img:"https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=400"},
{id:4,name:"Sony WH-1000XM5",cat:"Audio",price:65000,img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400"},
{id:5,name:"Nike Air Jordan",cat:"Shoes",price:25000,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
{id:6,name:"Apple Watch Ultra",cat:"Wearables",price:95000,img:"https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=400"}
];
let cart=JSON.parse(localStorage.getItem('pasindu_cart_v2')||'[]');

function renderProducts(){
document.getElementById('products').innerHTML=products.map(p=>`
<div class="card"><img src="${p.img}"><div class="card-body"><h3>${p.name}</h3><p>${p.cat}</p><div class="price">Rs. ${p.price.toLocaleString()}</div><button class="btn" onclick="addToCart(${p.id})">Add to Cart</button></div></div>
`).join('');
}
function addToCart(id){
const f=products.find(x=>x.id===id);let ex=cart.find(x=>x.id===id);
if(ex) ex.qty++; else cart.push({...f,qty:1});
save();
}
function deleteItem(id){
cart=cart.filter(x=>x.id!==id);
save();
}
function save(){
localStorage.setItem('pasindu_cart_v2',JSON.stringify(cart));
update();renderCart();
}
function update(){
let c=cart.reduce((a,b)=>a+b.qty,0);
document.getElementById('cartCount').innerText=c;
document.getElementById('headCount').innerText=c+' items';
let t=cart.reduce((a,b)=>a+b.price*b.qty,0);
document.getElementById('totalPrice').innerText='Rs. '+t.toLocaleString();
}
function renderCart(){
let box=document.getElementById('cartItems');
if(cart.length===0){box.innerHTML='<div class="empty">Cart empty 🛒<br>Add products!</div>';return;}
box.innerHTML=cart.map(i=>`
<div class="item"><div><h4>${i.name}</h4><small>Rs. ${i.price.toLocaleString()} x ${i.qty}</small></div><button class="del" onclick="deleteItem(${i.id})">Delete</button></div>
`).join('');
}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function checkout(){if(cart.length===0){alert('Cart empty!');return;}alert('Order placed! '+document.getElementById('totalPrice').innerText);cart=[];save();closeCart();}
renderProducts();update();
</script>
</body>
</html>
