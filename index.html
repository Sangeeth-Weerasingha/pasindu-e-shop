<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasindu E-Shop - Dark Pro</title>
<style>
:root{--bg:#0a0a0f;--card:#15151f;--border:#24243a;--accent:#7c5cff;--text:#fff;--muted:#8b8ba7}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
header{padding:20px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.9);backdrop-filter:blur(10px);z-index:10}
.logo{font-size:24px;font-weight:800;background:linear-gradient(90deg,#7c5cff,#4dd0e1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cart-btn{background:var(--card);border:1px solid var(--border);padding:10px 18px;border-radius:12px;color:#fff;cursor:pointer;display:flex;gap:8px;align-items:center}
.cart-count{background:var(--accent);padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700}
.container{padding:30px 5%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:0.3s}
.card:hover{transform:translateY(-5px);border-color:var(--accent)}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:16px}
.card h3{font-size:16px;margin-bottom:6px}
.card p{color:var(--muted);font-size:13px;margin-bottom:12px}
.price{font-size:20px;font-weight:800;color:#4dd0e1;margin-bottom:12px}
.add-btn{width:100%;background:var(--accent);border:none;padding:12px;border-radius:10px;color:#fff;font-weight:700;cursor:pointer}
.add-btn:hover{background:#6a4de8}
#cartPanel{position:fixed;right:-400px;top:0;width:380px;height:100vh;background:var(--card);border-left:1px solid var(--border);padding:24px;transition:0.4s;z-index:100;overflow-y:auto}
#cartPanel.open{right:0}
.cart-item{display:flex;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.cart-item img{width:60px;height:60px;border-radius:8px;object-fit:cover}
.checkout{width:100%;background:#fff;color:#000;border:none;padding:14px;border-radius:12px;font-weight:800;margin-top:20px;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="logo">PASINDU E-SHOP 🛒</div>
<button class="cart-btn" onclick="toggleCart()">🛒 Cart <span class="cart-count" id="cartCount">0</span></button>
</header>
<div class="container">
<div class="grid" id="productGrid"></div>
</div>
<div id="cartPanel">
<h2 style="margin-bottom:20px">Your Cart <span onclick="toggleCart()" style="float:right;cursor:pointer">✕</span></h2>
<div id="cartItems"></div>
<div style="margin-top:20px;border-top:1px solid #24243a;padding-top:16px">
<div style="display:flex;justify-content:space-between;font-size:18px;font-weight:800"><span>Total:</span><span id="total">$0</span></div>
<button class="checkout" onclick="checkout()">Checkout 🚀</button>
</div>
</div>
<script>
const fallbackProducts=[
{name:"AirPods Pro Dark",price:299.99,img:"https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500"},
{name:"MacBook Pro 16 M3",price:2499,img:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500"},
{name:"Mechanical Keyboard",price:129.99,img:"https://images.unsplash.com/photo-1589578228447-e1a4e481c6c8?w=500"},
{name:"Nike Air Dark",price:189,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{name:"Sony Headset",price:199,img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500"},
{name:"Watch Ultra",price:399,img:"https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=500"}
];

let products = [...fallbackProducts];

async function loadProducts(){
  try{
    const res = await fetch('http://localhost:8080/api/products');
    if(res.ok){
      const data = await res.json();
      if(data.length > 0) products = data;
    }
  }catch(e){
    console.log("Using fallback - backend not running");
  }
  // renderProducts(); // old
loadProducts(); // new - loads from DB
}
let cart=[];
function renderProducts(){
document.getElementById('productGrid').innerHTML=products.map((p,i)=>`
<div class="card">
<img src="${p.img}">
<div class="card-body">
<h3>${p.name}</h3><p>${p.cat} • Premium Quality</p>
<div class="price">$${p.price}</div>
<button class="add-btn" onclick="addToCart(${i})">Add to Cart</button>
</div></div>`).join('');
}
function addToCart(i){
cart.push(products[i]); updateCart();
document.getElementById('cartPanel').classList.add('open');
}
function updateCart(){
document.getElementById('cartCount').innerText=cart.length;
let total=cart.reduce((s,p)=>s+p.price,0);
document.getElementById('total').innerText='$'+total.toFixed(2);
document.getElementById('cartItems').innerHTML=cart.map((p,idx)=>`
<div class="cart-item">
<img src="${p.img}"><div><div style="font-weight:700">${p.name}</div><div style="color:#8b8ba7">$${p.price}</div></div>
<span onclick="removeItem(${idx})" style="margin-left:auto;cursor:pointer">🗑️</span></div>`).join('') || '<p style="color:#8b8ba7">Cart empty</p>';
}
function removeItem(i){cart.splice(i,1);updateCart();}
function toggleCart(){document.getElementById('cartPanel').classList.toggle('open');}
function checkout(){if(cart.length==0)return alert('Cart empty!');alert('Order Success! Total: $'+cart.reduce((s,p)=>s+p.price,0).toFixed(2)+' 🎉');cart=[];updateCart();toggleCart();}
renderProducts();
</script>
</body>
</html>
